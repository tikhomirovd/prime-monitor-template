[project]
name = "prime-monitor"
version = "0.1.0"
description = "Система мониторинга подписки ПРАЙМ — учебный проект"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.0",
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "pandas>=3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "nbstripout>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime"]
